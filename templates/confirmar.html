{% extends "base.html" %}
{% block content %}
<div class="card mx-auto" style="max-width:520px"><div class="card-body">
  <h1 class="h5"><i class="bi bi-exclamation-triangle text-danger"></i> Confirmar eliminación</h1>
  <p>¿Seguro que desea eliminar <b>{{ objeto }}</b>? Esta acción no se puede deshacer.</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger">Sí, eliminar</button>
    {% if volver_url %}<a class="btn btn-outline-secondary" href="{% url 'solicitud_detalle' volver_url %}">Cancelar</a>
    {% else %}<a class="btn btn-outline-secondary" href="{% url volver %}">Cancelar</a>{% endif %}
  </form>
</div></div>
{% endblock %}
