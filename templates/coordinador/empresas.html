{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">Empresas e instituciones</h1>
  <a class="btn btn-istam" href="{% url 'coo_empresa_nueva' %}"><i class="bi bi-plus-lg"></i> Nueva empresa</a>
</div>
<div class="card"><div class="table-responsive">
<table class="table table-hover align-middle mb-0">
  <thead class="table-light"><tr><th>Razón social</th><th>RUC</th><th>Tipo</th><th>Correo</th><th>Convenios</th><th></th></tr></thead>
  <tbody>{% for e in empresas %}
    <tr><td>{{ e.nombre }}</td><td>{{ e.ruc }}</td><td>{{ e.get_tipo_display }}</td><td>{{ e.correo }}</td><td>{{ e.n }}</td>
      <td class="text-end text-nowrap">
        <a class="btn btn-sm btn-outline-secondary" href="{% url 'coo_empresa_editar' e.pk %}"><i class="bi bi-pencil"></i></a>
        <a class="btn btn-sm btn-outline-danger" href="{% url 'coo_empresa_eliminar' e.pk %}"><i class="bi bi-trash"></i></a></td></tr>
  {% empty %}<tr><td colspan="6" class="text-center text-muted py-4">No hay empresas registradas.</td></tr>{% endfor %}</tbody>
</table></div></div>
{% endblock %}
