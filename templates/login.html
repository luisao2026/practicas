{% extends "base.html" %}{% load static %}
{% block title %}Ingresar{% endblock %}
{% block publico %}
<div class="login-fondo d-flex align-items-center justify-content-center p-3">
  <div class="card p-4" style="max-width:420px;width:100%">
    <div class="text-center mb-3">
      <img src="{% static 'img/logo_istam.png' %}" alt="Instituto Superior Tecnológico Amazónico" class="login-logo mb-3">
      <h1 class="h5 mb-0" style="color:var(--istam)">Sistema de Prácticas Preprofesionales</h1>
      <p class="text-muted small mb-0">{{ INSTITUCION_UBICACION }}</p>
    </div>
    {% if form.errors %}<div class="alert alert-danger py-2 small">Cédula o contraseña incorrectas.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Cédula</label>
        <input name="username" class="form-control" inputmode="numeric" maxlength="10" placeholder="0912345678" autofocus required></div>
      <div class="mb-3"><label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" required></div>
      <button class="btn btn-istam w-100">Ingresar</button>
    </form>
    <a class="d-block text-center small mt-3" href="{% url 'verificar' %}">Verificar un certificado</a>
  </div>
</div>
{% endblock %}
