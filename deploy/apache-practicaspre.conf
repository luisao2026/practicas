# /etc/apache2/sites-available/practicaspre.istam.edu.ec.conf
# Publica el sistema de prácticas (contenedor Docker en 127.0.0.1:8081) sin afectar a Moodle.
<VirtualHost *:80>
    ServerName practicaspre.istam.edu.ec

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    ProxyTimeout 120

    ProxyPass        / http://127.0.0.1:8081/
    ProxyPassReverse / http://127.0.0.1:8081/

    # Tamaño máximo de archivos subidos (20 MB)
    LimitRequestBody 20971520

    ErrorLog  ${APACHE_LOG_DIR}/practicaspre_error.log
    CustomLog ${APACHE_LOG_DIR}/practicaspre_access.log combined
</VirtualHost>
