# /etc/nginx/sites-available/practicas
# Cambie practicas.su-dominio.edu.ec por su dominio (o por la IP del servidor).
server {
    listen 80;
    server_name practicas.su-dominio.edu.ec;

    client_max_body_size 20M;   # tamaño máximo de los PDF que se suben

    # CSS, JS, íconos
    location /static/ {
        alias /home/practicas/practicas_istam/staticfiles/;
        expires 7d;
    }

    # Archivos subidos: NO son públicos. Django revisa permisos y le pide a Nginx entregarlos.
    location /media-interna/ {
        internal;
        alias /home/practicas/practicas_istam/media/;
    }

    location / {
        proxy_pass http://unix:/run/practicas/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
